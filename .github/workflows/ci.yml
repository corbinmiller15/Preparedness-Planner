name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

  # The contract schedule cannot report disabled_inactivity itself: a disabled
  # workflow does not run. Fork pull requests use a read-only token, so they
  # warn instead of calling the API. This job shares the nri-contract
  # concurrency group with the contract workflow so both cannot create the issue.
  contract-schedule:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nri-contract
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Alert if the contract schedule was disabled for inactivity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTRACT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GH_REPO}/actions/workflows/nri-contract.yml" --jq .state)"
          echo "Contract workflow state: ${state}"
          if [ -z "$state" ]; then
            echo "Workflow state was empty" >&2
            exit 1
          fi
          if [ "$state" = "disabled_inactivity" ]; then
            CONTRACT_OUTCOME=disabled_inactivity node scripts/nri-contract-issue.mjs
          fi

  contract-schedule-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fork pull requests cannot file the schedule alert
        run: echo "::warning::Skipping the FEMA contract schedule check on a fork pull request. The token cannot open issues."
